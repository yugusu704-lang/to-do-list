<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>待办清单 — 当前版本 Figma 导入稿</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #E5E5E5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 430px;
      background: var(--bg);
      min-height: 90vh;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      --bg: #FAFAF9;
      --card: #FFFFFF;
      --text: #2F3437;
      --text-secondary: #78716C;
      --text-muted: #A8A29E;
      --primary: #2563EB;
      --done: #16A34A;
      --danger: #DC2626;
      --border: #E8E5E3;
      --border-light: #F5F5F4;
    }
    /* 顶部区域 */
    .header {
      padding: 44px 20px 16px;
      background: var(--bg);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .header .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    /* 筛选栏 */
    .filter-bar {
      display: flex;
      gap: 24px;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border-light);
    }
    .filter-tab {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      padding-bottom: 8px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    /* 任务列表 */
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 4px;
    }
    /* 任务项 */
    .task-item {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.2s;
      position: relative;
    }
    .task-item:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .task-item.completed {
      opacity: 0.6;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #D6D3D1;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      cursor: pointer;
    }
    .checkbox.done {
      background: var(--done);
      border-color: var(--done);
    }
    .task-content {
      flex: 1;
      min-width: 0;
    }
    .task-text-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .task-text {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }
    .task-text.done {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-color: #D6D3D1;
    }
    .task-time {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .task-location {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .delete-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      font-size: 20px;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.15s;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-item:hover .delete-btn {
      opacity: 1;
    }
    .delete-btn:hover {
      background: #FEF2F2;
    }
    /* 底部输入栏 */
    .bottom-bar {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border-light);
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.95);
    }
    .input-main {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .input-main:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .input-secondary {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 13px;
      background: var(--card);
      color: var(--text-secondary);
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .input-secondary:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }
    .add-btn {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      background: #2F3437;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .add-btn:hover {
      background: #1a1d1f;
    }
    .add-btn:active {
      transform: scale(0.97);
    }
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-secondary);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .empty-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .empty-desc {
      font-size: 14px;
      line-height: 1.5;
    }
    /* 撤销 toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #2F3437;
      color: white;
      padding: 12px 20px;
      border-radius: 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      animation: fadeInUp 0.2s ease-out;
    }
    .toast button {
      background: none;
      border: none;
      color: #60A5FA;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 标题区 -->
    <header class="header">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <h1>待办清单</h1>
        <button style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; display:none;">清除已完成 (0)</button>
      </div>
      <p class="subtitle">0 个未完成</p>
    </header>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <div class="filter-tab active">全部</div>
      <div class="filter-tab">进行中</div>
      <div class="filter-tab">已完成</div>
    </div>

    <!-- 空状态 -->
    <div class="task-list">
      <div class="empty-state">
        <div class="empty-icon">✓</div>
        <div class="empty-title">还没有任务</div>
        <div class="empty-desc">添加一个待办事项开始吧</div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="bottom-bar">
      <input class="input-main" type="text" placeholder="添加新任务..." />
      <div class="input-row">
        <input class="input-secondary" type="datetime-local" placeholder="设置时间" />
        <input class="input-secondary" type="text" placeholder="地点（选填）" />
      </div>
      <button class="add-btn">添加</button>
    </div>

    <!-- toast -->
    <div class="toast" style="display:none;">
      <span>已清除 0 条任务</span>
      <button>撤销</button>
    </div>
  </div>
</body>
</html>
