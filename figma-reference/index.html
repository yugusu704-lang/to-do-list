<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>待办清单 — Figma 参考稿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #E5E5E5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    /* 手机壳 */
    .phone-frame {
      width: 375px;
      height: 812px;
      background: #FAFAF9;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.15), 0 0 0 8px #1C1917, 0 0 0 10px #333;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 状态栏占位 */
    .status-bar {
      height: 44px;
      background: #FAFAF9;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1C1917;
      flex-shrink: 0;
    }
    .status-bar .time { font-variant-numeric: tabular-nums; }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons .dot { width: 6px; height: 6px; background: #1C1917; border-radius: 50%; }

    /* 可滚动内容区 */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* 任务项 */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #F0F0F0;
      transition: background 0.2s ease-out;
    }
    .todo-item:active { background: #FAFAF9; }

    /* 圆圈复选框 */
    .circle-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #2563EB;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-out;
      cursor: pointer;
    }
    .circle-check.completed {
      background: #16A34A;
      border-color: #16A34A;
    }
    .circle-check svg {
      width: 12px;
      height: 12px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease-out;
    }
    .circle-check.completed svg {
      opacity: 1;
      transform: scale(1);
    }

    /* 文字 */
    .todo-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.5;
      color: #1C1917;
      transition: color 0.2s ease-out;
      word-break: break-word;
    }
    .todo-text.completed {
      color: #D4D4D4;
      text-decoration: line-through;
    }

    /* 删除按钮 */
    .delete-btn {
      opacity: 0;
      transform: translateX(8px);
      transition: all 0.15s ease-out;
      color: #DC2626;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px 8px;
    }
    .todo-item:hover .delete-btn,
    .todo-item:active .delete-btn {
      opacity: 1;
      transform: translateX(0);
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      gap: 20px;
      padding: 10px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #F0F0F0;
    }
    .filter-tab {
      font-size: 15px;
      font-weight: 500;
      color: #78716C;
      padding-bottom: 8px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease-out;
      cursor: pointer;
    }
    .filter-tab.active {
      color: #2563EB;
      border-bottom-color: #2563EB;
    }

    /* 底部输入栏 */
    .bottom-bar {
      background: #FFFFFF;
      border-top: 1px solid #F0F0F0;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .bottom-input {
      flex: 1;
      height: 44px;
      border: 1px solid #E5E5E5;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease-out;
      background: #FAFAF9;
      color: #1C1917;
    }
    .bottom-input:focus {
      border-color: #2563EB;
    }
    .add-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #2563EB;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease-out;
      border: none;
    }
    .add-btn:active {
      transform: scale(0.95);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: #78716C;
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.6;
    }
    .empty-state .title {
      font-size: 17px;
      font-weight: 600;
      color: #1C1917;
      margin-bottom: 6px;
    }
    .empty-state .desc {
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot" style="width:8px;border-radius:2px;"></span>
      </div>
    </div>

    <!-- 可滚动区 -->
    <div class="scroll-area">
      <!-- 标题区 -->
      <div style="padding: 8px 20px 12px; background: #FAFAF9;">
        <h1 style="font-size: 28px; font-weight: 700; color: #1C1917; margin: 0; letter-spacing: -0.02em;">待办清单</h1>
        <p style="font-size: 14px; color: #78716C; margin: 4px 0 0;">剩余 3 项未完成</p>
      </div>

      <!-- 筛选标签 -->
      <div class="filter-bar">
        <div class="filter-tab active">全部</div>
        <div class="filter-tab">进行中</div>
        <div class="filter-tab">已完成</div>
      </div>

      <!-- 任务列表 -->
      <div id="todo-list">
        <div class="todo-item">
          <div class="circle-check">
            <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"></polyline>
            </svg>
          </div>
          <span class="todo-text">整理学习笔记</span>
          <span class="delete-btn">删除</span>
        </div>

        <div class="todo-item">
          <div class="circle-check">
            <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"></polyline>
            </svg>
          </div>
          <span class="todo-text completed">完成 React 组件重构</span>
          <span class="delete-btn">删除</span>
        </div>

        <div class="todo-item">
          <div class="circle-check">
            <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"></polyline>
            </svg>
          </div>
          <span class="todo-text">去医院图书馆还书</span>
          <span class="delete-btn">删除</span>
        </div>

        <div class="todo-item">
          <div class="circle-check completed">
            <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"></polyline>
            </svg>
          </div>
          <span class="todo-text completed">买牛奶</span>
          <span class="delete-btn">删除</span>
        </div>

        <div class="todo-item">
          <div class="circle-check">
            <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,6 5,9 10,3"></polyline>
            </svg>
          </div>
          <span class="todo-text">整理学习笔记</span>
          <span class="delete-btn">删除</span>
        </div>
      </div>

      <!-- 空状态（默认隐藏，可手动在浏览器里调为 block 预览） -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="icon">☕</div>
        <div class="title">还没有任务</div>
        <div class="desc">在下方输入框添加你的第一个待办事项</div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="bottom-bar">
      <input class="bottom-input" type="text" placeholder="添加新任务..." />
      <button class="add-btn">+</button>
    </div>
  </div>
</body>
</html>
